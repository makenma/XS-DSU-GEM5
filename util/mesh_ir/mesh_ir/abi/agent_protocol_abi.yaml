  AGENT_PROXY_DRAIN: {source_class: DATA_PLANE_INVARIANT, component_kind: AGENT_AXI_PROXY, object_kind: FAULT_CONTEXT, detail_code: E_AGENT_AXI_PROXY_DRAIN}

invariant_site_projections_v1:
  DCORE_STATE: {source_class: DATA_PLANE_INVARIANT, component_kind: DUMMY_CORE, object_kind: INTERNAL, detail_code: E_AGENT_PROTOCOL_FATAL}
  LEDGER_OWNERSHIP: {source_class: INTERNAL_INVARIANT, component_kind: NPU_FRONTEND, object_kind: INTERNAL, detail_code: E_AGENT_PROTOCOL_FATAL}
