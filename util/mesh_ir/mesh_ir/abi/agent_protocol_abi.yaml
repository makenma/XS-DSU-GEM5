  HOST_STAGE_ORDER: {source_class: INTERNAL_INVARIANT, component_kind: HOST_AGENT, object_kind: INTERNAL, detail_code: E_HOST_STAGE_ORDER}
  RELEASE_WAITER_STATUS: {source_class: INTERNAL_INVARIANT, component_kind: HOST_AGENT, object_kind: INTERNAL, detail_code: E_RELEASE_WAITER_STATUS}
  RELEASE_SUBMIT_ROLLBACK: {source_class: INTERNAL_INVARIANT, component_kind: HOST_AGENT, object_kind: INTERNAL, detail_code: E_RELEASE_SUBMIT_ROLLBACK}
