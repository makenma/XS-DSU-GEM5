schema: agent_protocol_abi
description: >
  Single source of truth for the AgentAxiDriver-NPU SQ/CQ protocol (spec
  section 8).  Generates Python records (mesh_ir/generated/agent_abi.py),
  the C++ header (src/dev/ai_mesh/generated/agent_protocol_abi.hh) and the
  reference document (docs/generated/agent_protocol_abi.md).  All integers
  little-endian; CRC is CRC32C/Castagnoli.
abi:
  major: 1
  minor: 0

enums:
  sq_opcode:
    GENERATE: 0x0001
    RELEASE_SESSION: 0x0002
    CANCEL: 0x0003
  sq_flags:
    REQUIRE_KV_REUSE: 0x0001
    ALLOW_REPREFILL: 0x0002
    BATCH_REPLAY: 0x0004
  cq_flags:
    METADATA_VALID: 0x0001
    OUTPUT_BYTES_EXTENDED: 0x0002
    PARTIAL_OUTPUT: 0x0004
    SQ_SEQ_ONLY_ERROR: 0x0008
    CONTROL_COMMAND: 0x0010
    SQ_IDENTITY_ERROR: 0x0020
    DETAIL_IN_CQ: 0x0040
    SQ_ABI_ERROR: 0x0080
  cq_status:
    SUCCESS: 0x0000
    CANCELLED: 0x0001
    NOT_FOUND: 0x0002
    ALREADY_TERMINAL: 0x0003
    BUSY: 0x0004
    STALE_GENERATION: 0x0005
    SQ_CRC: 0x0101
    PARAM_ERROR: 0x0102
    PROFILE_ERROR: 0x0103
    PROGRAM_ERROR: 0x0201
    AXI_ERROR: 0x0202
    INTERNAL_ERROR: 0x02ff
  semantic_phase:
    PREFILL: 0x01
    DECODE: 0x02
    PUBLISH: 0x03
  tlv_type:
    INPUT_DIGEST: 0x0001
    DEADLINE: 0x0002
    OUTPUT_CHUNK_BYTES: 0x0003
    WORKLOAD_ID_DIGEST: 0x0004
  output_tlv_type:
    DIAGNOSTIC: 0x1001
    TIMING_BREAKDOWN: 0x1002
    ROUTE_DIGESTS: 0x1003
  tlv_flags:
    REQUIRED: 0x0001
  binding_kind:
    HOST_INPUT: 0x0001
    HOST_OUTPUT: 0x0002
    KV_EXTERNAL: 0x0003
    WEIGHT_EXTERNAL: 0x0004
  binding_flags:
    READ: 0x0001
    WRITE: 0x0002
    PERSISTENT: 0x0004
    RESOLVE_BY_HANDLE: 0x0008
  diagnostic_component:
    FRONTEND: 0x0001
    MESH_CORE: 0x0002
    DMA_AXI: 0x0003
    MOE_CACHE: 0x0004
    SERVING_KV: 0x0005
  run_exit_reason:
    QUIESCENT_SUCCESS: 0
    INFRA_FATAL: 20
    WATCHDOG: 21
    TEST_ASSERTION_FAILED: 22
    CONFIG_ERROR: 23
    INTERNAL_ABORT: 24
  detail_severity_v1:
    INFO: 0
    REQUEST_RECOVERABLE: 1
    CONFIG_FATAL: 2
    BUSINESS_TERMINAL: 3
    TEST_ASSERTION: 4
    INFRA_FATAL: 5
  fatal_source_class_v1:
    SQ_INTAKE: 0
    PUBLICATION_AMBIGUITY: 1
    CQ_OR_METADATA: 2
    CONTROL_UPDATE: 3
    MSI: 4
    HOST_ACK_RESPONSE: 5
    DATA_PLANE_INVARIANT: 6
    INTERNAL_INVARIANT: 7
  fatal_site_domain_v1:
    FAULT: 0
    INVARIANT: 1
  fault_site_v1:
    SQ_R_TRANSPORT: 0
    SEQUENCE_MISMATCH: 1
    DOORBELL_AMBIGUOUS_OR_ACCEPTANCE_CONFLICT: 2
    CQ_ENTRY_B: 3
    METADATA_B: 4
    SQ_HEAD_B: 5
    CQ_TAIL_B: 6
    OUTPUT_METADATA_RELEASE_FENCE: 7
    CQ_RELEASE_FENCE: 8
    DRIVER_CQ_READ: 9
    DRIVER_METADATA_READ: 10
    ACK_B_PROVEN_NO_TARGET_COMMIT: 11
    ACK_B_AFTER_TARGET_COMMIT: 12
    CONTROL_BAD_ID_OR_WINDOW: 13
    MSI_TARGET_OR_B: 14
    AGENT_PROXY_DRAIN: 15
    RESERVED_16: 16
  invariant_site_v1:
    DCORE_STATE: 0
    LEDGER_OWNERSHIP: 1
    RING_SEQUENCE: 2
    KV_PIN: 3
    CACHE_TOKEN: 4
    ADDRESS_ALIAS: 5
    GLOBAL_DRAIN: 6
    HOST_STAGE_ORDER: 7
    RELEASE_WAITER_STATUS: 8
    RELEASE_SUBMIT_ROLLBACK: 9
    SQ_CAPACITY_OWNERSHIP: 10
    CQ_CAPACITY_OWNERSHIP: 11
    REQUEST_CONTEXT_CAPACITY_OWNERSHIP: 12
    SQ_MALFORMED_INTERNAL: 13
  fatal_component_kind_v1:
    HOST_AGENT: 0
    NPU_COMMAND: 1
    NPU_FRONTEND: 2
    KV_MANAGER: 3
    DUMMY_CORE: 4
    MOE_CACHE: 5
    AXI_ENDPOINT: 6
    AGENT_AXI_PROXY: 7
    GARNET: 8
    INTERNAL: 9
  endpoint_kind_v1:
    HOST_AXI: 0
    NPU_AXI: 1
    HOST_CONTROL: 2
    NPU_CONTROL: 3
    HOST_MEMORY: 4
    NPU_MEMORY: 5
    MSI_TARGET: 6
    DUMMY_CORE_P2P: 7
    AGENT_PROXY_PORT: 8
    GARNET_NI: 9
  fatal_object_kind_v1:
    SQ_INTAKE: 0
    PUBLICATION: 1
    CQ_ENTRY: 2
    OUTPUT_METADATA: 3
    CONTROL_UPDATE: 4
    MSI: 5
    HOST_ACK: 6
    MESH_OBJECT: 7
    INTERNAL: 8
    FAULT_CONTEXT: 9
  control_update_kind_v1:
    SQ_DOORBELL: 0
    CQ_HEAD_ACK: 1
    SQ_HEAD_UPDATE: 2
    CQ_TAIL_UPDATE: 3
    CQ_MSI: 4
    OUTPUT_METADATA_RELEASE_FENCE: 5
    CQ_RELEASE_FENCE: 6
  physical_source_kind_v1:
    AXI_TRANSACTION: 0
    FENCE: 1
    PROXY_TRANSFER: 2
    INTERNAL_EDGE: 3
    AXI_RESPONSE_OBSERVATION: 4
  axi_transaction_subkind_v1:
    READ_AR: 0
    WRITE_AW_W: 1
  axi_response_observation_subkind_v1:
    R: 0
    B: 1

detail_code_registry:
  E_OK: 0x00000000
  E_DCORE_COMMAND_STATE: 0x00010001
  E_DCORE_DEADLOCK: 0x00010002
  E_DCORE_ENGINE: 0x00010003
  E_DCORE_EVENT: 0x00010004
  E_DCORE_EVENT_NAMESPACE: 0x00010005
  E_DCORE_OPCODE: 0x00010006
  E_DCORE_POISON_READ: 0x00010007
  E_DCORE_QUEUE_CAPACITY: 0x00010008
  E_DCORE_REFERENCE_COMPUTE: 0x00010009
  E_DCORE_SRAM_BOUNDS: 0x0001000a
  E_DCORE_SRAM_LIFETIME: 0x0001000b
  E_DCORE_TIMING_OVERFLOW: 0x0001000c
  E_AXI_RESPONSE: 0x00020001
  E_AGENT_PROTOCOL_FATAL: 0x00020002
  E_COMPLETION_PATH_AXI: 0x00020003
  E_CQ_FULL: 0x00020004
  E_CQ_ORDER: 0x00020005
  E_INTERRUPT: 0x00020006
  E_SQ_CRC: 0x00020007
  E_SQ_FULL: 0x00020008
  E_SQ_MALFORMED: 0x00020009
  E_AGENT_AXI_PROXY_DRAIN: 0x0002000a
  E_REQUEST_CONTEXT_FULL: 0x0002000b
  E_REQUEST_BINDING: 0x0002000c
  E_BINDING_ALIAS_MISMATCH: 0x0002000d
  E_BINDING_ROLE: 0x0002000e
  E_RESERVED_FIELD: 0x0002000f
  E_PARAMETER_LENGTH_MISMATCH: 0x00020010
  E_REQUEST_IDENTITY: 0x00020011
  E_REQUEST_CANCELLED: 0x00020012
  E_AGENT_PLAN: 0x00030001
  E_AGENT_ROUND_LIMIT: 0x00030002
  E_BATCH_REPLAY_DIVERGENCE: 0x00030003
  E_WORKLOAD_CHANGED_BY_TIMING: 0x00030004
  E_WORKLOAD_PLAN_MISMATCH: 0x00030005
  E_MOE_CAPACITY: 0x00040001
  E_MOE_COMBINE_BYTES: 0x00040002
  E_MOE_DISPATCH_BYTES: 0x00040003
  E_MOE_MATERIALIZE_CAPACITY: 0x00040004
  E_MOE_PROFILE: 0x00040005
  E_MOE_ROUTE_DIGEST: 0x00040006
  E_MOE_ROUTE_REPLAY: 0x00040007
  E_MOE_TOPK_DUP: 0x00040008
  E_UNSUPPORTED_WEIGHT_RESIDENCY: 0x00040009
  E_HOST_IO_SIZE_MISMATCH: 0x00050001
  E_OUTPUT_CAPACITY: 0x00050002
  E_OUTPUT_CHUNK_MISMATCH: 0x00050003
  E_REQUEST_PROFILE: 0x00050004
  E_REQUEST_PROFILE_KEY: 0x00050005
  E_SESSION_EXISTS: 0x00050006
  E_KV_FLAG_COMBINATION: 0x00050007
  E_KV_REUSE_REQUIRED: 0x00050008
  E_KV_SESSION_NOT_FOUND: 0x00050009
  E_KV_STATE: 0x0005000a
  E_KV_TOKEN_MISMATCH: 0x0005000b
  E_KV_STALE_GENERATION: 0x0005000c
  E_KV_CONTRACT_MISMATCH: 0x0005000d
  E_HOST_POOL_CAPACITY: 0x00060001
  E_HOST_STAGE_ORDER: 0x00060002
  E_RAW_LOG_ENTERED_NPU_FABRIC: 0x00060003
  E_RELEASE_WAITER_STATUS: 0x00060004
  E_RELEASE_SUBMIT_ROLLBACK: 0x00060005
  E_ADDRESS_PLAN: 0x00070001
  E_CAPABILITY_MISMATCH: 0x00070002
  E_CAPACITY_PLAN: 0x00070003
  E_TRAFFIC_MISMATCH: 0x00070004
  E_GLOBAL_DRAIN: 0x00070005

detail_dispositions_v1:
  E_OK: {severity: INFO, cq_status: SUCCESS, run_exit_reason: null}
  E_REQUEST_CANCELLED: {severity: REQUEST_RECOVERABLE, cq_status: CANCELLED, run_exit_reason: null}
  E_SQ_CRC: {severity: REQUEST_RECOVERABLE, cq_status: SQ_CRC, run_exit_reason: null}
  E_REQUEST_BINDING: &parameter_error {severity: REQUEST_RECOVERABLE, cq_status: PARAM_ERROR, run_exit_reason: null}
  E_BINDING_ALIAS_MISMATCH: *parameter_error
  E_BINDING_ROLE: *parameter_error
  E_RESERVED_FIELD: *parameter_error
  E_PARAMETER_LENGTH_MISMATCH: *parameter_error
  E_REQUEST_IDENTITY: *parameter_error
  E_OUTPUT_CAPACITY: *parameter_error
  E_OUTPUT_CHUNK_MISMATCH: *parameter_error
  E_SESSION_EXISTS: *parameter_error
  E_KV_FLAG_COMBINATION: *parameter_error
  E_WORKLOAD_PLAN_MISMATCH: *parameter_error
  E_HOST_IO_SIZE_MISMATCH: &profile_error {severity: REQUEST_RECOVERABLE, cq_status: PROFILE_ERROR, run_exit_reason: null}
  E_REQUEST_PROFILE: *profile_error
  E_REQUEST_PROFILE_KEY: *profile_error
  E_KV_REUSE_REQUIRED: *profile_error
  E_KV_TOKEN_MISMATCH: *profile_error
  E_KV_CONTRACT_MISMATCH: *profile_error
  E_KV_SESSION_NOT_FOUND: {severity: REQUEST_RECOVERABLE, cq_status: NOT_FOUND, run_exit_reason: null}
  E_KV_STALE_GENERATION: {severity: REQUEST_RECOVERABLE, cq_status: STALE_GENERATION, run_exit_reason: null}
  E_DCORE_COMMAND_STATE: &program_error {severity: REQUEST_RECOVERABLE, cq_status: PROGRAM_ERROR, run_exit_reason: null}
  E_DCORE_ENGINE: *program_error
  E_DCORE_EVENT: *program_error
  E_DCORE_EVENT_NAMESPACE: *program_error
  E_DCORE_OPCODE: *program_error
  E_DCORE_POISON_READ: *program_error
  E_DCORE_SRAM_BOUNDS: *program_error
  E_DCORE_SRAM_LIFETIME: *program_error
  E_DCORE_TIMING_OVERFLOW: *program_error
  E_MOE_CAPACITY: *program_error
  E_MOE_COMBINE_BYTES: *program_error
  E_MOE_DISPATCH_BYTES: *program_error
  E_MOE_MATERIALIZE_CAPACITY: *program_error
  E_MOE_PROFILE: *program_error
  E_MOE_ROUTE_DIGEST: *program_error
  E_MOE_ROUTE_REPLAY: *program_error
  E_MOE_TOPK_DUP: *program_error
  E_KV_STATE: *program_error
  E_AXI_RESPONSE: {severity: REQUEST_RECOVERABLE, cq_status: AXI_ERROR, run_exit_reason: null}
  E_DCORE_QUEUE_CAPACITY: &config_fatal {severity: CONFIG_FATAL, cq_status: null, run_exit_reason: CONFIG_ERROR}
  E_DCORE_REFERENCE_COMPUTE: *config_fatal
  E_AGENT_PLAN: *config_fatal
  E_BATCH_REPLAY_DIVERGENCE: *config_fatal
  E_UNSUPPORTED_WEIGHT_RESIDENCY: *config_fatal
  E_HOST_POOL_CAPACITY: *config_fatal
  E_ADDRESS_PLAN: *config_fatal
  E_CAPABILITY_MISMATCH: *config_fatal
  E_CAPACITY_PLAN: *config_fatal
  E_AGENT_ROUND_LIMIT: {severity: BUSINESS_TERMINAL, cq_status: null, run_exit_reason: null}
  E_WORKLOAD_CHANGED_BY_TIMING: &test_assertion {severity: TEST_ASSERTION, cq_status: null, run_exit_reason: TEST_ASSERTION_FAILED}
  E_RAW_LOG_ENTERED_NPU_FABRIC: *test_assertion
  E_TRAFFIC_MISMATCH: *test_assertion
  E_DCORE_DEADLOCK: {severity: INFRA_FATAL, cq_status: null, run_exit_reason: WATCHDOG}
  E_AGENT_PROTOCOL_FATAL: &infra_fatal {severity: INFRA_FATAL, cq_status: null, run_exit_reason: INFRA_FATAL}
  E_COMPLETION_PATH_AXI: *infra_fatal
  E_CQ_FULL: *infra_fatal
  E_CQ_ORDER: *infra_fatal
  E_INTERRUPT: *infra_fatal
  E_SQ_FULL: *infra_fatal
  E_SQ_MALFORMED: *infra_fatal
  E_AGENT_AXI_PROXY_DRAIN: *infra_fatal
  E_REQUEST_CONTEXT_FULL: *infra_fatal
  E_HOST_STAGE_ORDER: *infra_fatal
  E_RELEASE_WAITER_STATUS: *infra_fatal
  E_RELEASE_SUBMIT_ROLLBACK: *infra_fatal
  E_GLOBAL_DRAIN: *infra_fatal

fault_site_projections_v1:
  SQ_R_TRANSPORT: {source_class: SQ_INTAKE, component_kind: NPU_COMMAND, object_kind: SQ_INTAKE, detail_code: E_AGENT_PROTOCOL_FATAL}
  SEQUENCE_MISMATCH: {source_class: SQ_INTAKE, component_kind: NPU_COMMAND, object_kind: SQ_INTAKE, detail_code: E_AGENT_PROTOCOL_FATAL}
  DOORBELL_AMBIGUOUS_OR_ACCEPTANCE_CONFLICT: {source_class: PUBLICATION_AMBIGUITY, component_kind: HOST_AGENT, object_kind: PUBLICATION, detail_code: E_AGENT_PROTOCOL_FATAL}
  CQ_ENTRY_B: {source_class: CQ_OR_METADATA, component_kind: NPU_FRONTEND, object_kind: CQ_ENTRY, detail_code: E_COMPLETION_PATH_AXI}
  METADATA_B: {source_class: CQ_OR_METADATA, component_kind: NPU_FRONTEND, object_kind: OUTPUT_METADATA, detail_code: E_COMPLETION_PATH_AXI}
  SQ_HEAD_B: {source_class: CONTROL_UPDATE, component_kind: NPU_COMMAND, object_kind: CONTROL_UPDATE, detail_code: E_COMPLETION_PATH_AXI}
  CQ_TAIL_B: {source_class: CONTROL_UPDATE, component_kind: NPU_FRONTEND, object_kind: CONTROL_UPDATE, detail_code: E_COMPLETION_PATH_AXI}
  OUTPUT_METADATA_RELEASE_FENCE: {source_class: CQ_OR_METADATA, component_kind: NPU_FRONTEND, object_kind: CONTROL_UPDATE, detail_code: E_COMPLETION_PATH_AXI}
  CQ_RELEASE_FENCE: {source_class: CQ_OR_METADATA, component_kind: NPU_FRONTEND, object_kind: CONTROL_UPDATE, detail_code: E_COMPLETION_PATH_AXI}
  DRIVER_CQ_READ: {source_class: CQ_OR_METADATA, component_kind: HOST_AGENT, object_kind: CQ_ENTRY, detail_code: E_AGENT_PROTOCOL_FATAL}
  DRIVER_METADATA_READ: {source_class: CQ_OR_METADATA, component_kind: HOST_AGENT, object_kind: OUTPUT_METADATA, detail_code: E_AGENT_PROTOCOL_FATAL}
  ACK_B_PROVEN_NO_TARGET_COMMIT: {source_class: HOST_ACK_RESPONSE, component_kind: HOST_AGENT, object_kind: HOST_ACK, detail_code: E_COMPLETION_PATH_AXI}
  ACK_B_AFTER_TARGET_COMMIT: {source_class: HOST_ACK_RESPONSE, component_kind: HOST_AGENT, object_kind: HOST_ACK, detail_code: E_COMPLETION_PATH_AXI}
