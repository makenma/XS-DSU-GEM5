schema: agent_protocol_abi
description: >
  Single source of truth for the AgentAxiDriver-NPU SQ/CQ protocol (spec
  section 8).  Generates Python records (mesh_ir/generated/agent_abi.py),
  the C++ header (src/dev/ai_mesh/generated/agent_protocol_abi.hh) and the
  reference document (docs/generated/agent_protocol_abi.md).  All integers
  little-endian; CRC is CRC32C/Castagnoli.
abi:
  major: 1
  minor: 0

enums:
  sq_opcode:
    GENERATE: 0x0001
    RELEASE_SESSION: 0x0002
    CANCEL: 0x0003
  sq_flags:
    REQUIRE_KV_REUSE: 0x0001
    ALLOW_REPREFILL: 0x0002
    BATCH_REPLAY: 0x0004
  cq_flags:
    METADATA_VALID: 0x0001
    OUTPUT_BYTES_EXTENDED: 0x0002
    PARTIAL_OUTPUT: 0x0004
    SQ_SEQ_ONLY_ERROR: 0x0008
    CONTROL_COMMAND: 0x0010
    SQ_IDENTITY_ERROR: 0x0020
    DETAIL_IN_CQ: 0x0040
    SQ_ABI_ERROR: 0x0080
  cq_status:
    SUCCESS: 0x0000
    CANCELLED: 0x0001
    NOT_FOUND: 0x0002
    ALREADY_TERMINAL: 0x0003
    BUSY: 0x0004
    STALE_GENERATION: 0x0005
    SQ_CRC: 0x0101
    PARAM_ERROR: 0x0102
    PROFILE_ERROR: 0x0103
    PROGRAM_ERROR: 0x0201
    AXI_ERROR: 0x0202
    INTERNAL_ERROR: 0x02ff
  semantic_phase:
    PREFILL: 0x01
    DECODE: 0x02
    PUBLISH: 0x03
  tlv_type:
    INPUT_DIGEST: 0x0001
    DEADLINE: 0x0002
    OUTPUT_CHUNK_BYTES: 0x0003
    WORKLOAD_ID_DIGEST: 0x0004
  output_tlv_type:
    DIAGNOSTIC: 0x1001
    TIMING_BREAKDOWN: 0x1002
    ROUTE_DIGESTS: 0x1003
  tlv_flags:
    REQUIRED: 0x0001
  binding_kind:
    HOST_INPUT: 0x0001
    HOST_OUTPUT: 0x0002
    KV_EXTERNAL: 0x0003
    WEIGHT_EXTERNAL: 0x0004
  binding_flags:
    READ: 0x0001
    WRITE: 0x0002
    PERSISTENT: 0x0004
    RESOLVE_BY_HANDLE: 0x0008
  diagnostic_component:
    FRONTEND: 0x0001
    MESH_CORE: 0x0002
    DMA_AXI: 0x0003
    MOE_CACHE: 0x0004
    SERVING_KV: 0x0005
  run_exit_reason:
    QUIESCENT_SUCCESS: 0
    INFRA_FATAL: 20
    WATCHDOG: 21
    TEST_ASSERTION_FAILED: 22
    CONFIG_ERROR: 23
    INTERNAL_ABORT: 24

detail_code_registry:
  E_OK: 0x00000000
  E_DCORE_COMMAND_STATE: 0x00010001
  E_DCORE_DEADLOCK: 0x00010002
  E_DCORE_ENGINE: 0x00010003
  E_DCORE_EVENT: 0x00010004
  E_DCORE_EVENT_NAMESPACE: 0x00010005
  E_DCORE_OPCODE: 0x00010006
  E_DCORE_POISON_READ: 0x00010007
  E_DCORE_QUEUE_CAPACITY: 0x00010008
  E_DCORE_REFERENCE_COMPUTE: 0x00010009
  E_DCORE_SRAM_BOUNDS: 0x0001000a
  E_DCORE_SRAM_LIFETIME: 0x0001000b
  E_DCORE_TIMING_OVERFLOW: 0x0001000c
  E_AXI_RESPONSE: 0x00020001
  E_AGENT_PROTOCOL_FATAL: 0x00020002
  E_COMPLETION_PATH_AXI: 0x00020003
  E_CQ_FULL: 0x00020004
  E_CQ_ORDER: 0x00020005
  E_INTERRUPT: 0x00020006
  E_SQ_CRC: 0x00020007
  E_SQ_FULL: 0x00020008
  E_SQ_MALFORMED: 0x00020009
  E_AGENT_AXI_PROXY_DRAIN: 0x0002000a
  E_REQUEST_CONTEXT_FULL: 0x0002000b
  E_REQUEST_BINDING: 0x0002000c
  E_BINDING_ALIAS_MISMATCH: 0x0002000d
  E_BINDING_ROLE: 0x0002000e
  E_RESERVED_FIELD: 0x0002000f
  E_PARAMETER_LENGTH_MISMATCH: 0x00020010
  E_REQUEST_IDENTITY: 0x00020011
  E_REQUEST_CANCELLED: 0x00020012
  E_AGENT_PLAN: 0x00030001
  E_AGENT_ROUND_LIMIT: 0x00030002
  E_BATCH_REPLAY_DIVERGENCE: 0x00030003
  E_WORKLOAD_CHANGED_BY_TIMING: 0x00030004
  E_WORKLOAD_PLAN_MISMATCH: 0x00030005
  E_MOE_CAPACITY: 0x00040001
  E_MOE_COMBINE_BYTES: 0x00040002

records:
  SQ_DESCRIPTOR:
    bytes: 64
    crc:
      algorithm: crc32c
      cover: [0, 60]
      field: crc32
    fields:
      - {name: abi_major, type: u16, offset: 0}
      - {name: abi_minor, type: u16, offset: 2}
      - {name: opcode, type: u16, offset: 4, enum: sq_opcode}
      - {name: flags, type: u16, offset: 6, enum: sq_flags, flags: true}
      - {name: sq_seq, type: u64, offset: 8}
      - {name: request_id, type: u64, offset: 16}
      - {name: session_id, type: u64, offset: 24}
      - {name: parameter_block_addr, type: u64, offset: 32}
      - {name: parameter_block_bytes, type: u32, offset: 40}
      - {name: program_id, type: u16, offset: 44}
      - {name: profile_id, type: u16, offset: 46}
      - {name: completion_cookie, type: u64, offset: 48}
      - {name: qos, type: u8, offset: 56}
      - {name: flags2, type: u8, offset: 57}
      - {name: reserved, type: u16, offset: 58, const_zero: true}
      - {name: crc32, type: u32, offset: 60}
  CQ_DESCRIPTOR:
    bytes: 32
    fields:
      - {name: cq_seq, type: u64, offset: 0}
      - {name: request_id, type: u64, offset: 8}
      - {name: completion_cookie, type: u64, offset: 16}
      - {name: status, type: u16, offset: 24, enum: cq_status}
      - {name: flags, type: u16, offset: 26, enum: cq_flags, flags: true}
      - {name: output_bytes_or_detail_code, type: u32, offset: 28}
  PARAMETER_HEADER:
    bytes: 160
    crc:
      algorithm: crc32c
      cover: [0, 152]
      field: crc32
    fields:
      - {name: magic, type: u32, offset: 0, const: 0x504e4741}
      - {name: abi_major, type: u16, offset: 4}
      - {name: abi_minor, type: u16, offset: 6}
      - {name: header_bytes, type: u32, offset: 8, const: 160}
      - {name: total_bytes, type: u32, offset: 12}
      - {name: flags, type: u32, offset: 16}
      - {name: reserved, type: u32, offset: 20, const_zero: true}
      - {name: input_addr, type: u64, offset: 24}
      - {name: input_bytes, type: u64, offset: 32}
      - {name: input_tokens, type: u32, offset: 40}
      - {name: cached_tokens, type: u32, offset: 44}
      - {name: output_addr, type: u64, offset: 48}
      - {name: output_capacity_bytes, type: u64, offset: 56}
      - {name: output_metadata_addr, type: u64, offset: 64}
      - {name: output_metadata_capacity_bytes, type: u32, offset: 72}
      - {name: max_output_tokens, type: u32, offset: 76}
      - {name: kv_handle, type: u64, offset: 80}
      - {name: kv_generation, type: u32, offset: 88}
      - {name: moe_route_profile_id, type: u32, offset: 92}
      - {name: user_id, type: u32, offset: 96}
      - {name: task_seq, type: u32, offset: 100}
      - {name: repair_round, type: u16, offset: 104}
      - {name: qos, type: u8, offset: 106}
      - {name: request_kind, type: u8, offset: 107}
      - {name: workload_plan_item_id, type: u32, offset: 108}
      - {name: target_request_id, type: u64, offset: 112}
      - {name: binding_table_offset, type: u32, offset: 120}
      - {name: binding_count, type: u16, offset: 124}
      - {name: binding_record_bytes, type: u16, offset: 126, const: 24}
      - {name: extension_offset, type: u32, offset: 128}
      - {name: extension_bytes, type: u32, offset: 132}
      - {name: requested_profile_key, type: u64, offset: 136}
      - {name: reserved2, type: u64, offset: 144, const_zero: true}
      - {name: crc32, type: u32, offset: 152}
      - {name: reserved3, type: u32, offset: 156, const_zero: true}
  BINDING_RECORD:
    bytes: 24
    fields:
      - {name: symbol_id, type: u32, offset: 0}
      - {name: kind, type: u16, offset: 4, enum: binding_kind}
      - {name: flags, type: u16, offset: 6, enum: binding_flags, flags: true}
      - {name: address, type: u64, offset: 8}
      - {name: bytes, type: u64, offset: 16}
  OUTPUT_METADATA:
    bytes: 128
    crc:
      algorithm: crc32c
      cover_zero_field: crc32
      field: crc32
    fields:
      - {name: magic, type: u32, offset: 0, const: 0x4f4e4741}
      - {name: abi_major, type: u16, offset: 4}
      - {name: abi_minor, type: u16, offset: 6}
      - {name: header_bytes, type: u32, offset: 8, const: 128}
      - {name: total_bytes, type: u32, offset: 12}
      - {name: flags, type: u32, offset: 16}
      - {name: terminal_status, type: u32, offset: 20, enum: cq_status}
      - {name: request_id, type: u64, offset: 24}
      - {name: session_id, type: u64, offset: 32}
      - {name: user_id, type: u32, offset: 40}
      - {name: task_seq, type: u32, offset: 44}
      - {name: repair_round, type: u16, offset: 48}
      - {name: reserved, type: u16, offset: 50, const_zero: true}
      - {name: output_tokens, type: u32, offset: 52}
      - {name: output_bytes, type: u64, offset: 56}
      - {name: semantic_content_digest, type: bytes32, offset: 64}
      - {name: completed_instance_count, type: u32, offset: 96}
      - {name: moe_invocation_count, type: u32, offset: 100}
      - {name: request_start_tick, type: u64, offset: 104}
      - {name: terminal_ready_tick, type: u64, offset: 112}
      - {name: crc32, type: u32, offset: 120}
      - {name: reserved2, type: u32, offset: 124, const_zero: true}
  TLV_HEADER:
    bytes: 8
    fields:
      - {name: type, type: u16, offset: 0}
      - {name: flags, type: u16, offset: 2, enum: tlv_flags, flags: true}
      - {name: payload_bytes, type: u32, offset: 4}
