    REQUEST_END: 2
    HALT: 3
    DMA_LOAD: 4
    DMA_STORE: 5
    DMA_P2P_PUSH: 6
    DMA_PREFETCH: 7
    DMA_FILL: 8
    AXI_FENCE: 9
    GEMM: 10
    BMM: 11
    ELEMENTWISE: 12
    LOCAL_REDUCE: 13
    SOFTMAX: 14
    NORM: 15
    EVENT_WAIT: 16
    EVENT_SIGNAL: 17
    RECV_WAIT: 18
    BARRIER: 19
    REPEAT: 20
  engine:
