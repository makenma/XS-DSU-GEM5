schema: mesh_ir_abi
description: >
  Single source of truth for the Scheduled Mesh IR binary ABI (.mshb).
  Generates Python constants/records (mesh_ir/generated/abi.py), the C++
  loader header (src/dev/ai_mesh/generated/mesh_ir_abi.hh) and the ABI
  reference document (docs/generated/mesh_ir_abi.md). All integers are
  little-endian; every record carries explicit reserved fields and no
  implicit padding. Unknown enum values, non-zero reserved fields and
  unknown required-feature bits are rejected fail-closed by every reader.
abi:
  major: 1
  minor: 3
  min_reader_minor: 3
magic_hex: "4d53484200000001"

canonical:
  json_safe_integer_max: 9007199254740991
  abi_fields:
    major: {program_field: abi_major, type: u16}
    minor: {program_field: abi_minor, type: u16}
    min_reader_minor: {program_field: min_reader_minor, type: u16}
    required_features: {program_field: required_features, type: u64}
  program_fields:
    - {name: abi, kind: abi, semantic: true}
    - {name: arch_digest, kind: bytes, semantic: true}
    - {name: sections, kind: transport_sections, semantic: true}
    - {name: semantics, kind: semantic_ref, semantic: true}
    - {name: semantic_sha256, kind: digest, semantic: false}
  transport_sections:
    STRINGS: {program_field: strings, projection: strings, optional: false, semantic: true}
    ENTRYPOINTS: {program_field: entrypoints, projection: records, optional: false, semantic: true}
    PROFILES: {program_field: profiles, projection: records, optional: false, semantic: true}
    TENSORS: {program_field: tensors, projection: records, optional: false, semantic: true}
    SHARDS: {program_field: shards, projection: records, optional: false, semantic: true}
    ALLOCATIONS: {program_field: allocations, projection: records, optional: false, semantic: true}
    STREAMS: {program_field: streams, projection: records, optional: false, semantic: true}
    COMMANDS: {program_field: commands, projection: records, optional: false, semantic: true}
    COMMAND_WAITS: {program_field: command_waits, projection: records, optional: false, semantic: true}
    COMMAND_OPERANDS: {program_field: command_operands, projection: records, optional: false, semantic: true}
    EVENTS: {program_field: events, projection: records, optional: false, semantic: true}
    DMA_DESCRIPTORS: {program_field: dma_descriptors, projection: records, optional: false, semantic: true}
    OP_ATTRS: {program_field: op_attrs, projection: attr_payloads, optional: false, semantic: true}
    RELOCATIONS: {program_field: relocations, projection: records, optional: false, semantic: true}
    EXPECTED_TRAFFIC: {program_field: expected_traffic, projection: records, optional: false, semantic: true}
    SOURCE_MAP: {program_field: source_map, projection: records, optional: true, semantic: false}
    PROFILE_HINTS: {program_field: profile_hints, projection: records, optional: true, semantic: false}
    CONTENT_DIGESTS: {program_field: content_digests, projection: records, optional: true, semantic: true}

required_features:
  SCHEDULED_SEMANTICS:
    bit: 1
    min_reader_minor: 3

optional_sections:
  - SOURCE_MAP
  - PROFILE_HINTS
  - CONTENT_DIGESTS

semantic_wire_types:
  semantic_ref:
    bytes: 8
    fields:
      - {name: section_type, type: u16, offset: 0}
      - {name: reserved, type: u16, offset: 2, const_zero: true}
      - {name: row_id, type: u32, offset: 4}
  list_span:
    bytes: 8
    fields:
      - {name: begin, type: u32, offset: 0}
      - {name: count, type: u32, offset: 4}
  string_ref:
    bytes: 8
    fields:
      - {name: string_id, type: u32, offset: 0}
      - {name: reserved, type: u32, offset: 4, const_zero: true}
  enum_value:
    bytes: 8
    fields:
      - {name: value, type: u32, offset: 0}
      - {name: reserved, type: u32, offset: 4, const_zero: true}
  scalar_value:
    bytes: 16
    fields:
      - {name: kind, type: u16, offset: 0, enum: scalar_kind}
      - {name: reserved, type: bytes6, offset: 2, const_zero: true}
      - {name: payload, type: u64, offset: 8}

