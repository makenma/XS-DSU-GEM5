semantic_wire_types:
  semantic_ref:
    bytes: 8
    fields:
    - name: section_type
      type: u16
      offset: 0
    - name: reserved
      type: u16
      offset: 2
      const_zero: true
    - name: row_id
      type: u32
      offset: 4
  list_span:
    bytes: 8
    fields:
    - name: begin
      type: u32
      offset: 0
    - name: count
      type: u32
      offset: 4
  string_ref:
    bytes: 8
    fields:
    - name: string_id
      type: u32
      offset: 0
    - name: reserved
      type: u32
      offset: 4
      const_zero: true
  enum_value:
    bytes: 8
    fields:
    - name: value
      type: u32
      offset: 0
    - name: reserved
      type: u32
      offset: 4
      const_zero: true
  scalar_value:
    bytes: 16
    fields:
    - name: kind
      type: u16
      offset: 0
      enum: scalar_kind
    - name: reserved
      type: bytes6
      offset: 2
      const_zero: true
    - name: payload
      type: u64
      offset: 8
