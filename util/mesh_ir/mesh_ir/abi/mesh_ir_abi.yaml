schema: mesh_ir_abi
description: >
  Single source of truth for the Scheduled Mesh IR binary ABI (.mshb).
  Generates Python constants/records (mesh_ir/generated/abi.py), the C++
  loader header (src/dev/ai_mesh/generated/mesh_ir_abi.hh) and the ABI
  reference document (docs/generated/mesh_ir_abi.md). All integers are
  little-endian; every record carries explicit reserved fields and no
  implicit padding. Unknown enum values, non-zero reserved fields and
  unknown required-feature bits are rejected fail-closed by every reader.
abi:
  major: 1
  minor: 2
  min_reader_minor: 0
magic_hex: "4d53484200000001"

features:
  DYNAMIC_MOE_V1:
    bit: 0
    min_writer_minor: 1
  AGENT_SERVING_V1:
    bit: 1
    min_writer_minor: 1

conditional_required_sections:
  DYNAMIC_MOE_V1:
    - MOE_LAYER_SPECS
    - MOE_EXPERT_SPECS
    - MOE_DYNAMIC_REGIONS
    - MOE_KERNEL_SPECS
    - CONTENT_DIGESTS
  AGENT_SERVING_V1:
    - AGENT_REQUEST_PROFILES
    - AGENT_INSTANCE_PROFILES
    - AGENT_SOURCE_CORE_MAP
    - AGENT_INSTANCE_MEMBER_BINDINGS
    - AGENT_REQUEST_BINDING_REQUIREMENTS
    - AGENT_PUBLISH_SURROGATE_BINDINGS

constants:
  DMA_FILL_RUNTIME_BOUND_SENTINEL: 0x52554e54494d4531

enums:
  section_type:
    STRINGS: 1
    ENTRYPOINTS: 2
    PROFILES: 3
    TENSORS: 4
    SHARDS: 5
    ALLOCATIONS: 6
    STREAMS: 7
    COMMANDS: 8
    COMMAND_WAITS: 9
    COMMAND_OPERANDS: 10
    EVENTS: 11
    DMA_DESCRIPTORS: 12
    OP_ATTRS: 13
    RELOCATIONS: 14
    EXPECTED_TRAFFIC: 15
    SOURCE_MAP: 101
    PROFILE_HINTS: 102
    CONTENT_DIGESTS: 103
    MOE_LAYER_SPECS: 16384
    MOE_EXPERT_SPECS: 16385
    MOE_DYNAMIC_REGIONS: 16386
    MOE_KERNEL_SPECS: 16387
    AGENT_REQUEST_PROFILES: 16388
    AGENT_INSTANCE_PROFILES: 16389
    AGENT_SOURCE_CORE_MAP: 16390
    AGENT_INSTANCE_MEMBER_BINDINGS: 16391
    AGENT_REQUEST_BINDING_REQUIREMENTS: 16392
    AGENT_PUBLISH_SURROGATE_BINDINGS: 16393
  required_sections:
    - STRINGS
    - ENTRYPOINTS
    - PROFILES
    - TENSORS
    - SHARDS
    - ALLOCATIONS
    - STREAMS
    - COMMANDS
    - COMMAND_WAITS
    - COMMAND_OPERANDS
    - EVENTS
    - DMA_DESCRIPTORS
    - OP_ATTRS
    - RELOCATIONS
    - EXPECTED_TRAFFIC
  opcode:
