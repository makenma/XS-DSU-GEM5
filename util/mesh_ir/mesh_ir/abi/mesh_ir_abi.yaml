      - {name: region_group_id, type: u32, offset: 8}
      - {name: region_id, type: u32, offset: 12}
      - {name: ordinal, type: u32, offset: 16}
      - {name: generation, type: u32, offset: 20}
      - {name: aux_key, type: bytes16, offset: 24}
  ENTRYPOINTS:
